packages:
  - "apps/*"
  - "packages/*"

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
    - zod

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  "@astrojs/check": ^0.9.10
  "@astrojs/starlight": ^0.42.0
  "@types/node": ^22.20.2
  astro: ^7.3.2
  hono: ^4.13.7
  oxfmt: ^0.67.0
  oxlint: ^1.82.0
  typescript: ^5.9.3
  vitest: ~4.1.0
  wrangler: ^4.131.1
  zod: ^4.6.4

minimumReleaseAgeExclude:
  - zod@4.6.4
